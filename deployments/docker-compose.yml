version: "3.8"

services:
  core-engine:
    build:
      context: ./services/core-engine
      dockerfile: Dockerfile
    container_name: atlas-core-engine
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  ai-orchestrator:
    build:
      context: ./services/ai-orchestrator
      dockerfile: Dockerfile
    container_name: atlas-ai-orchestrator
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - HOST=0.0.0.0
      - CORE_ENGINE_URL=http://core-engine:8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:-""}
      - GEMINI_MODEL=gemini-2.5-flash
    depends_on:
      core-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: atlas-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  web:
    image: nginx:alpine
    container_name: atlas-web
    ports:
      - "3000:80"
    volumes:
      - ./services/web:/usr/share/nginx/html:ro

volumes:
  qdrant_storage:
